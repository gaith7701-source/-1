name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create project
        run: |
          flutter create --org com.muthakkarati --project-name muthakkarati myapp
          mkdir -p myapp/lib
          cp lib/main.dart myapp/lib/main.dart
          cat > myapp/pubspec.yaml << 'ENDOFPUBSPEC'
          name: muthakkarati
          description: مذكرتي المدرسية
          version: 1.0.0+1

          environment:
            sdk: '>=3.4.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            sqflite: ^2.3.2
            path: ^1.9.0
            shared_preferences: ^2.2.3
            intl: ^0.19.0
            http: ^1.2.0

          flutter:
            uses-material-design: true
          ENDOFPUBSPEC

      - name: Build APK
        working-directory: myapp
        run: |
          flutter pub get
          flutter build apk --debug --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: muthakkarati-apk
          path: myapp/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
          
